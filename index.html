<!DOCTYPE html>
<html lang="en">
    
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>BadrTech</title>

    <script src="https://cheerpj.com"></script>

</head>
    
<body>
    <div id="cheerpjContainer"></div>

    <script>
        async function runJava() {
            await cheerpjInit();
            cheerpjCreateDisplay(800, 600);
            await cheerpjRunJar("/app/StandaloneApp.jar");
        }
        
        window.addEventListener('load', runJava);
    </script>
    
</body>
    
</html>
