<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>    
    <title>BadrTech</title>
</head>
<body>
    <div id="cheerpj-container" style="width: 800px; height: 600px;" />
    <script>
         async function runJava() {       
             await cheerpjInit({
                 enableStringSharing: true
                 javaProperties: [
                    "-Dsun.java2d.fontpath=/app/fonts"
                ]
             });
             cheerpjCreateDisplay(-1, -1, document.getElementById("cheerpj-container"));
             await cheerpjRunJar("/app/Point-of-Sale/StandaloneApp.jar", {preload: true});
         }
        window.addEventListener('load', runJava);
    </script>
</body>
</html>
