<!DOCTYPE html>
<html lang="ar">
    
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BadrTechnology</title>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #FFFFFF;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        #applicationContainer {
            width: 800px;
            height: 700;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            background-color: #FFFFFF;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
    
    <script src="https://cjrtnc.leaningtech.com/4.3/loader.js" />
    
</head>
    
<body onload="initCheerpJ()">

    <div id="applicationContainer" />

    <script>
        async function initCheerpJ() {

            await cheerpjInit({
                javaProperties: [
                    "-Dsun.java2d.fontpath=/app/Point-of-Sale/fonts"
                ]
            });
            
            cheerpjCreateDisplay(800, 600, document.getElementById("applicationContainer"));

            await cheerpjRunJar(
                "/app/Point-of-Sale/StandaloneApp.jar",
                {
                    preload: true
                }
            );
        }
        
    </script>
    
</body>
    
</html>
